.host)} · Session <span class="mono">${esc(t.host_session_id)}</span>${t.closed_ts?' · Closed '+stamp(t.closed_ts):''}</p><div class="task-totals"><div><div class="small muted">Total cost · 总费用</div><strong>${usd(t.total_cost_usd)}</strong></div><div><div class="small muted">Total wall · 总耗时</div><strong>${duration(t.total_wall_ms)}</strong></div><div><div class="small muted">Rounds · 轮次</div><strong>${num(t.current_round)}</strong></div><div><div class="small muted">First pass · 首轮通过</div><strong>${t.first_pass==null?'—':t.first_pass?'Yes · 是':'No · 否'}</strong></div></div>${d.rounds.length?d.rounds.map(renderRound).join(''):empty('No rounds yet · 暂无执行轮次')}<details class="panel events" ${detailsOpen?'open':''}><summary>Events · 事件 <span class="muted">(${num(d.events.length)})</span></summary>${d.events.map(e=>`<div class="event-row"><span class="mono">${esc(e.type)}</span><time title="${esc(e.ts)}">${stamp(e.ts)}</time></div>`).join('')}</details>`+footer()}
function armTable(rows){return `<div class="table-scroll"><table><thead><tr><th>Arm · 策略</th><th class="num">n</th><th class="num">Accepted</th><th class="num">CPAT</th><th class="num">Quality</th><th class="num">性价比</th><th class="num">Mean cost</th><th class="num">Mean wall</th><th>Evidence · 样本</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${chip(a.arm)}</td><td class="num">${num(a.n)}</td><td class="num good">${num(a.accepted)}</td><td class="num">${usd(a.cpat)}</td><td class="num">${num(a.quality_score)}</td><td class="num">${num(a.quality_per_cost)}</td><td class="num">${usd(a.mean_cost_usd)}</td><td class="num">${duration(a.mean_wall_ms)}</td><td class="${a.insufficient?'insufficient':''}">${a.insufficient?'样本不足 / insufficient':'Sufficient · 样本充足'}</td></tr>`).join('')}</tbody></table></div>`}
function strataChart(rows,arms){if(!rows.length)return empty('No strata in this window · 此时间范围暂无分层数据');const keys=[...new Set(rows.map(r=>r.key))],max=Math.max(0,...rows.map(r=>r.cpat||0)),h=keys.reduce((n,k)=>n+39+rows.filter(r=>r.key===k).length*38,0)+30;let y=23;let svg=`<svg viewBox="0 0 560 ${h}" role="img" aria-label="CPAT by stratum and arm; hatched bars indicate insufficient samples"><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="7" stroke="var(--grey)" stroke-width="2"/></pattern></defs>`;for(const k of keys){svg+=`<text x="0" y="${y}" class="key">${esc(k)}</text>`;y+=17;for(const r of rows.filter(r=>r.key===k)){const j=arms.findIndex(a=>a.arm===r.arm),width=max?Math.max(0,r.cpat||0)/max*270:0,color=j%2?'var(--host)':'var(--accent)';svg+=`<text x="0" y="${y+14}">${esc(r.arm)}</text><rect x="28" y="${y}" width="270" height="21" rx="2" fill="var(--subtle)"/><rect x="28" y="${y}" width="${width}" height="21" rx="2" fill="${color}" opacity=".8"/>${r.insufficient?`<rect x="28" y="${y}" width="270" height="21" fill="url(#hatch)" opacity=".55"/>`:''}<text x="311" y="${y+14}">${esc(usd(r.cpat))}</text><text x="397" y="${y+14}" style="font-size:10px">${r.insufficient?'样本不足 / insufficient':'n = '+esc(r.n)}</text>`;y+=38}y+=22}svg+='</svg>';return svg}
async function renderCompare(g){const r=await request('/api/report?since='+encodeURIComponent(since)+'&by='+by);if(g!==generation)return;const control=`<div class="toolbar"><label class="select-label" for="since">Since · 范围</label><select id="since">${['7d','14d','30d','all'].map(v=>`<option value="${v}" ${since===v?'selected':''}>${v==='all'?'All · 全部':v}</option>`).join('')}</select><label class="select-label" for="by">By · 分层</label><select id="by">${['label','language','time_bucket','has_repro','cross_file'].map(v=>`<option ${by===v?'selected':''}>${v}</option>`).join('')}</select></div>`;$('#main').innerHTML=title('policy experiment / 策略实验','Compare','对比','Cost per accepted task. Quality in context. · 每个通过任务的成本与质量。',control)+`<section class="panel"><div class="panel-head"><h2>Policy arms <span>· 策略组</span></h2><span class="small">${esc(r.header.policy_name)} · ${num(r.header.closed_tasks)} closed / ${num(r.header.accepted_tasks)} accepted</span></div>${r.arms.length?armTable(r.arms):empty('No policy arms · 暂无策略组')}${r.arms.length>=2?(r.detectability.comparisons||[]).map(c=>`<div class="comparison"><strong>${esc(c.a)} / ${esc(c.b)}</strong><span>Ratio <b>${num(c.ratio)}</b></span><span>90% CI <b>${num(c.ci_low)}–${num(c.ci_high)}</b></span><span>p <b>${num(c.p)}</b></span><span>MDD <b>${pct(c.mdd)}</b></span>${c.insufficient?pill('样本不足 / insufficient'):''}</div>`).join(''):''}<div class="panel-foot">CPAT = total cost / accepted tasks · 性价比 = quality / CPAT. Lower CPAT is better. <span>α ${num(r.detectability.alpha)} · Power ${pct(r.detectability.power)}</span></div></section><div class="compare-grid"><section class="panel"><div class="panel-head"><h2>CPAT by ${esc(by)} <span>· 分层</span></h2><span class="small">USD · lower is better ↓</span></div><div class="chart">${strataChart(r.strata,r.arms)}</div><div class="panel-foot">Hatched cells: n &lt; 8 · 斜线表示样本不足</div></section><div><section class="panel"><div class="panel-head"><h2>Alerts <span>· 提醒</span></h2>${pill(r.alerts.length)}</div>${r.alerts.length?r.alerts.map(a=>`<div class="list-entry"><div class="small warn">! ${esc(a.code)}</div><p>${esc(a.message)}</p></div>`).join(''):empty('No alerts · 暂无提醒')}</section><section class="panel section-gap"><div class="panel-head"><h2>Suggestions <span>· 建议</span></h2><span class="small">Read only · 只读</span></div>${r.suggestions.length?r.suggestions.map(s=>`<div class="list-entry"><strong>${esc(s.n)}. <code>${esc(s.field)}</code></strong><p><code>${esc(JSON.stringify(s.from))}</code> → <code>${esc(JSON.stringify(s.to))}</code></p><p class="muted">${esc(s.evidence)}</p></div>`).join(''):empty('No policy edits suggested.\n继续收集样本，暂无策略调整建议。')}</section></div></div><section class="panel"><div class="panel-head"><h2>Target profiles <span>· 目标表现</span></h2><span class="small">Closed tasks in selected window</span></div>${targetTable(r.targets)}</section><details class="panel events"><summary>Report context · 报告上下文</summary><div class="list-entry small muted">${stamp(r.header.since)} → ${stamp(r.header.now)}<br>Policy versions: ${r.header.policy_versions.map(esc).join(', ')} · ${esc(r.header.experiment_mode)}<br>Overall MDD: ${pct(r.detectability.mdd)}${r.header.saved_to?'<br>Saved: '+esc(r.header.saved_to):''}</div>${(r.detectability.by_label||[]).map(l=>`<div class="event-row"><span>${esc(l.analysis_label)} · n ${num(l.n)}</span><span>MDD ${pct(l.mdd)}</span></div>`).join('')}</details>`+footer('Report numbers supplied by core · 统计由核心提供')}
function targetTable(rows){if(!rows.length)return empty('No target profiles · 暂无目标数据');return `<div class="table-scroll"><table><thead><tr><th>Target</th><th class="num">n / dispatches</th><th class="num">Accepted</th><th class="num">First / final pass</th><th class="num">CPAT / quality</th><th class="num">Mean cost / wall</th><th class="num">Failure rate</th><th>Reject reasons</th><th class="num">Classifier p50 / p90</th><th>Evidence</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${chip(t.target)}${t.style_suspected?'<p>'+pill('style suspected','badge-warn')+'</p>':''}</td><td class="num">${num(t.n)} / ${num(t.dispatches)}</td><td class="num good">${num(t.accepted)}</td><td class="num">${pct(t.first_pass_rate)} / ${pct(t.final_pass_rate)}</td><td class="num">${usd(t.cpat)} / ${num(t.quality_score)}</td><td class="num">${usd(t.mean_cost_usd)}<br><span class="muted small">${duration(t.mean_wall_ms)}</span></td><td class="num">${pct(t.failure_rate)}<br><span class="small muted">${num(t.failures)} failures</span></td><td class="wrap small">${Object.entries(t.reject_reasons||{}).map(([k,v])=>esc(k)+': '+num(v)).join(' · ')||'—'}<br><span class="muted">Style ${num(t.style_rejections)} / ${num(t.rejections)} (${pct(t.style_ratio)})</span></td><td class="num">${num(t.classifier_latency_p50_ms)} / ${num(t.classifier_latency_p90_ms)} ms</td><td class="${t.insufficient?'insufficient':''}">${t.insufficient?'样本不足 / insufficient':'Sufficient · 样本充足'}</td></tr>`).join('')}</tbody></table></div>`}
const costColors=['var(--blue)','var(--host)','var(--review)','var(--overhead)'];
function sessionBars(s){const values=[s.delegated_cost_usd,s.host_round_cost_usd,s.reviewer_cost_usd,s.overhead_cost_usd],labels=['Delegated','Host rounds','Acceptance','Overhead'],peakTotal=s.peak_cost_usd+s.off_cost_usd;return `<div class="cost-stack"><strong>${usd(s.total_cost_usd)}</strong><div class="bar" role="img" aria-label="${esc(values.map((v,i)=>labels[i]+' '+usd(v)).join(', '))}">${values.map((v,i)=>`<span title="${labels[i]} ${usd(v)}" style="width:${s.total_cost_usd?v/s.total_cost_usd*100:0}%;background:${costColors[i]}"></span>`).join('')}</div><div class="small muted">${values.map(usd).join(' / ')}</div><div class="bar peak" role="img" aria-label="Peak ${usd(s.peak_cost_usd)}, off ${usd(s.off_cost_usd)}"><span title="Peak ${usd(s.peak_cost_usd)}" style="width:${peakTotal?s.peak_cost_usd/peakTotal*100:0}%;background:var(--accent)"></span><span title="Off ${usd(s.off_cost_usd)}" style="width:${peakTotal?s.off_cost_usd/peakTotal*100:0}%;background:var(--grey)"></span></div><div class="small muted">Peak ${usd(s.peak_cost_usd)} / Off ${usd(s.off_cost_usd)}</div></div>`}
async function renderSessions(g){const d=await request('/api/sessions?since='+encodeURIComponent(since));if(g!==generation)return;$('#main').innerHTML=title('session accounting / 会话核算','Sessions','会话','Where each session spends. · 每个会话的费用去向。',`<div class="toolbar"><label class="select-label" for="since">Since · 范围</label><select id="since">${['7d','14d','30d','all'].map(v=>`<option value="${v}" ${since===v?'selected':''}>${v==='all'?'All · 全部':v}</option>`).join('')}</select></div>`)+`<section class="panel"><div class="panel-head"><h2>Host sessions <span>· 宿主会话</span></h2><span class="small">Select to filter tasks · 点击筛选任务</span></div>${d.sessions.length?`<div class="table-scroll"><table><thead><tr><th>Session · 会话</th><th>First / last · 起止</th><th class="num">Tasks / accepted / open</th><th>Cost composition · 费用构成</th><th>Targets used</th><th>Reviewer tokens · 评审用量</th></tr></thead><tbody>${d.sessions.map(s=>`<tr class="session-row" data-session-row="${esc(s.host_session_id)}"><td class="session-info"><button class="session-button" data-session="${esc(s.host_session_id)}" title="${esc(s.host_session_id)}">${esc(s.host_session_id.slice(0,19))} ↗</button><div class="small muted">${esc(s.host)}</div></td><td class="small">${stamp(s.first_ts)}<br><span class="muted">${stamp(s.last_ts)}</span></td><td class="num">${num(s.tasks)} / <span class="good">${num(s.accepted)}</span> / <span class="blue">${num(s.open)}</span></td><td>${sessionBars(s)}</td><td><div class="pills">${Object.entries(s.targets||{}).map(([t,n])=>chip(t+' × '+n)).join('')}</div></td><td class="small">Input ${num(s.reviewer_tokens?.input)}<br><span class="muted">Cached ${num(s.reviewer_tokens?.cached_input)} · Output ${num(s.reviewer_tokens?.output)}</span></td></tr>`).join('')}</tbody></table></div>`:empty('No sessions in this window · 此时间范围暂无会话')}<div class="session-legend"><div class="legend">${['Delegated · 委派','Host rounds · 宿主','Acceptance · 验收','Overhead · 路由开销'].map((v,i)=>`<span><i style="background:${costColors[i]}"></i>${v}</span>`).join('')}<span><i style="background:var(--accent)"></i>Peak · 高峰</span><span><i style="background:var(--grey)"></i>Off · 低谷</span></div></div></section><p class="note">Routing overhead includes classifier + labeler. · 路由开销包含分类器与标注器费用。</p>`+footer()}
async function openDrawer(round,stream){returnFocus=document.activeElement;const seq=++drawerRequest,id=taskId;$('#drawer-root').innerHTML=`<div class="drawer-backdrop"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="panel-head"><div><h2 id="drawer-title">${stream==='stderr'?'Stderr · 错误流':'Output · 输出'}</h2><div class="small muted mono">${esc(id)} / round ${esc(round)}</div></div><button data-action="close-drawer" aria-label="Close output drawer">Close · 关闭 ×</button></div><pre tabindex="0">Loading · 读取中…</pre></section></div>`;$('.drawer button').focus();try{const text=await request('/api/task/'+encodeURIComponent(id)+'/output?round='+round+'&stream='+stream,true);if(seq===drawerRequest&&$('.drawer pre'))$('.drawer pre').textContent=text||'Empty · 无内容'}catch(e){if(seq===drawerRequest&&$('.drawer pre'))$('.drawer pre').textContent='Unable to load · 无法读取: '+e.message}}
function closeDrawer(){drawerRequest++;const wasOpen=$('#drawer-root').hasChildNodes();$('#drawer-root').innerHTML='';if(wasOpen&&returnFocus?.isConnected)returnFocus.focus()}
function previewRow(el){if(!el?.dataset.live||selectedLive===el.dataset.task)return;selectedLive=el.dataset.task;document.querySelectorAll('.task-row').forEach(row=>row.classList.toggle('selected',row.dataset.task===selectedLive));loadTail(selectedLive,{stick:true,scroll:0})}
document.addEventListener('focusin',e=>previewRow(e.target.closest('[data-live]')));
document.addEventListener('pointerover',e=>{if(e.pointerType!=='touch')previewRow(e.target.closest('[data-live]'))});
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(action==='retry')refresh();if(action==='close-drawer')closeDrawer();if(action==='clear-filter'){sessionFilter='';syncFilter();refresh()}if(action==='resume-tail'&&$('#live-output'))$('#live-output').scrollTop=$('#live-output').scrollHeight;if(e.target.classList.contains('drawer-backdrop'))closeDrawer();const row=e.target.closest('[data-task]');if(row){selectedLive=row.dataset.task;location.hash='task/'+encodeURIComponent(row.dataset.task)}const out=e.target.closest('[data-output]');if(out)openDrawer(out.dataset.output,out.dataset.stream);const s=e.target.closest('[data-session-row]');if(s){sessionFilter=s.dataset.sessionRow;syncFilter();location.hash='live'}});
document.addEventListener('change',e=>{if(e.target.id==='since'){since=e.target.value;refresh()}if(e.target.id==='by'){by=e.target.value;refresh()}if(e.target.id==='task-state'){taskListState=e.target.value;refresh()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeUpdate(true);closeDrawer()}if(e.key==='Tab'&&$('.drawer')){const nodes=[...$('.drawer').querySelectorAll('button,[tabindex="0"]')],first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
setInterval(()=>{if(view!=='live')return;for(const t of currentTasks){const el=[...document.querySelectorAll('[data-running]')].find(x=>x.dataset.running===t.task_id);if(!el)continue;const running=liveRunning(t),orphan=running!=null&&running>900000;el.textContent=duration(running);el.classList.toggle('warn',orphan);const row=el.closest('.task-row');row.classList.toggle('orphan',orphan);if(orphan)row.querySelector('.state').innerHTML='<i class="dot warn"></i>orphan'}},1000);
let polling=null,stream=null;
function status(text,cls){$('#connection-text').textContent=text;$('#connection-dot').className='dot '+cls}
function startPolling(){status('polling · 5 s','warn');if(!polling)polling=setInterval(refresh,5000)}
if(mock){status('mock · 5 s','good');const bus=new EventTarget();bus.addEventListener('change',refresh);setInterval(()=>{mockSeq++;bus.dispatchEvent(new Event('change'))},5000)}else{try{stream=new EventSource('/api/stream');stream.onopen=()=>{if(polling){clearInterval(polling);polling=null}status('live · connected','good')};stream.addEventListener('change',()=>{status('live · connected','good');refresh()});stream.onerror=startPolling}catch{startPolling()}}
window.addEventListener('hashchange',route);route();
